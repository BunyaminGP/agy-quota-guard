name: CI

"on":
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Syntax / compile check
        run: |
          python -m py_compile scripts/quota_gate.py scripts/usage.py scripts/stream_render.py scripts/i18n.py scripts/notify.py scripts/agy_runner.py
          python -c "import json; json.load(open('plugin.json')); json.load(open('hooks.json'))"
          python -c "import json,glob; [json.load(open(f, encoding='utf-8')) for f in glob.glob('locales/*.json')]"

      - name: Python tests (pytest)
        run: python -m pytest -q
